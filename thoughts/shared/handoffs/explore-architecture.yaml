call_graph:
  total_files_analyzed: 95

  hot_paths:
    wind_calculation:
      flow:
        - WindScreen (wind.tsx)
        - useWindCalculator hook
        - calculateWindEffectRecursive()
        - YardageModelEnhanced.calculateAdjustedYardage()
      notes: Recursive algorithm converges on club selection

    environmental_data:
      flow:
        - EnhancedEnvironmentalProvider
        - Weather adapters (openmeteo/weatherkit/metar)
        - normalize.ts
        - density.ts → calculateAirDensity()
      notes: Multi-source weather with fallback chain

    shot_calculation:
      flow:
        - ShotScreen (index.tsx)
        - useEnhancedEnvironmental
        - Local calculation (no service call)
      notes: FREE tier - inline calculation, no wind

