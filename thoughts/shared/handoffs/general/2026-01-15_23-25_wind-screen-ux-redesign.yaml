questions:
  - Should lock button move to ActionBar or stay on compass edge? (leaning ActionBar)
  - Exact arrow style (SVG path vs Animated component)?

decisions:
  - arrow_over_text: Replace HEADWIND/TAILWIND/CROSSWIND text with arrow visualization for faster glance comprehension
  - flat_design_system: Use flat/MetricPill style on wind screen, no GlassCard for consistency
  - height_breakpoints: Responsive by screen height (<700 compact, 700-850 regular, >850 large), not device model
  - bottom_controls: All primary actions in thumb zone (bottom of screen) for one-handed use
  - inline_results: Show calculation results inline without screen transition

findings:
  - current_overlap_bugs: Lock button and compass elements overlap on multiple screen sizes
  - two_design_systems: Codebase has MetricPill (flat) vs GlassCard (gradients) - inconsistent
  - user_priority: "Wind relative to target" is the key info needed on course, not raw wind data
  - existing_modular_compass: Compass already split into DegreeMarks, CardinalDirections, WindArrow, PhoneArrow, LockButton

