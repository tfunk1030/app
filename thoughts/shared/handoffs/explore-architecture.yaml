summary: React Native golf app with freemium model - 3-tab redesign with wind calculator as premium feature

# ============================================================================
# ENTRY POINTS
# ============================================================================

entry_points:
  main:
    file: app/_layout.tsx
    role: Root layout with global error handling, providers, splash screen
    initializes:
      - ErrorBoundary (global crash prevention)
      - AppThemeProvider
      - AppProvider (consolidated context)
      - OnboardingFlow
      - Paywall modals

  router:
    file: app/index.tsx
    role: Redirects to tabs-redesign navigation

  tabs_layout:
    file: app/(tabs-redesign)/_layout.tsx
    role: 3-tab navigation structure (Shot, Wind, Setup)
    providers_added:
      - RedesignThemeProvider
      - AppProvider (again - nested!)
      - EnhancedEnvironmentalProvider

# ============================================================================
# ARCHITECTURAL LAYERS
# ============================================================================

layers:
  # ENTRY LAYER: Screens and navigation
  entry:
    - app/_layout.tsx              # Root layout
    - app/(tabs-redesign)/_layout.tsx  # Tab navigation
    - app/(tabs-redesign)/index.tsx    # Shot screen (FREE)
    - app/(tabs-redesign)/wind.tsx     # Wind calculator (PREMIUM)
    - app/(tabs-redesign)/setup.tsx    # Settings/clubs

  # MIDDLE LAYER: Context providers, hooks, business logic
  middle:
    providers:
      - src/core/context/AppProvider.tsx      # Consolidated provider tree
      - src/core/context/settings.tsx         # User settings
      - src/core/context/shotcalc.tsx         # Shot calculation state
      - src/core/context/theme.tsx            # Theme context
      - src/providers/EnhancedEnvironmentalProvider.tsx  # Weather data
      - src/features/settings/context/clubs.tsx   # Club bag management
      - src/features/settings/context/premium.tsx # Premium/freemium state
      - src/features/wind/context/compass-lock.tsx  # Compass lock state
      - src/features/wind/context/sensor-data.tsx   # Device sensors

    hooks:
      - src/features/wind/hooks/useWindCalculator.ts  # Core calculation hook
      - src/features/wind/hooks/useWindSettings.ts    # Wind preferences
      - src/features/clubs/hooks/useClubData.ts       # Club data hook
      - src/hooks/useAccessibility.ts                 # A11y animations
      - src/hooks/useConnectivity.ts                  # Network status
      - src/hooks/usePresets.ts                       # Preset management
      - src/hooks/useReduceMotion.ts                  # Motion preferences

  # LEAF LAYER: Services, utilities, pure calculations
  leaf:
    calculations:
      - src/services/calculations/wind-calculator.ts      # Core wind math
      - src/services/environmental-calculations.ts        # Env effects
      - src/core/models/YardageModel.ts                   # Club/yardage model

    weather:
      - src/services/weather/openmeteo-adapter.ts    # Primary weather API
      - src/services/weather/weatherkit-adapter.ts   # Apple WeatherKit
      - src/services/weather/metar-adapter.ts        # Airport weather
      - src/services/weather/nws-adapter.ts          # NWS weather
      - src/services/weather/normalize.ts            # Normalize data
      - src/services/weather/density.ts              # Air density calc
      - src/services/weather/stations.ts             # Weather stations

    utilities:
      - src/utils/LogManager.ts              # Logging
      - src/utils/FeatureFlags.ts            # Feature toggles
      - src/utils/responsive.ts              # Responsive sizing
      - src/utils/animations.ts              # Animation helpers
      - src/utils/cacheManager.ts            # Cache utilities
      - src/utils/club-mapping.ts            # Club name normalization
      - src/services/telemetry/logger.ts     # Telemetry

