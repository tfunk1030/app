  - name: "Club Recommendation"
    location: src/features/settings/context/clubs.tsx
    logic: "getRecommendedClub(yardage) returns closest club from bag"

# ============================================================================
# KEY PATTERNS
# ============================================================================

patterns:
  state_management:
    - pattern: React Context + useState
    - files: src/core/context/*.tsx
    - notes: No Redux/Zustand for most state, simple context

  ref_stability:
    - pattern: useRef + useCallback for stable dependencies
    - example: src/features/wind/hooks/useWindCalculator.ts:110-130
    - notes: Prevents unnecessary recalculations

  recursive_convergence:
    - pattern: Iterate until delta < threshold or max iterations
    - example: calculateWindEffectRecursive() in wind-calculator.ts
    - notes: Club selection converges in 1-3 iterations typically

  adapter_chain:
    - pattern: Multiple weather APIs with fallback
    - files: src/services/weather/*-adapter.ts
    - notes: OpenMeteo primary, others as fallback

