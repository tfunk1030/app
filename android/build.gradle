// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
    mavenLocal()
    // Add local Maven repository for React Native Gradle plugin
    maven {
      url = uri("${rootDir}/local-maven-repo")
    }
  }
  dependencies {
    classpath('com.android.tools.build:gradle:8.6.1')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20')
    // Note: Expo plugins require com.facebook.react:react-native-gradle-plugin
    // but it's only available as an included build. This is a known compatibility
    // issue between Expo SDK 53 and React Native 0.79. The included build should
    // make it available, but there's a Gradle limitation where included builds
    // can't resolve dependencies from other included builds during compilation.
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    // Add local Maven repository for React Native Gradle plugin
    // This allows included builds (Expo plugins) to resolve it
    maven {
      url = uri("${rootDir}/local-maven-repo")
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
